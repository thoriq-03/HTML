<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
   <style>
    /* Reset sederhana */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Times New Roman", Times, serif;
      line-height: 1.6;
      background-color: #f5f7fa;
      color: #333;
    }

    header {
      background: #004080;
      color: white;
      text-align: center;
      padding: 20px;
    }

    header h1 {
      margin-bottom: 10px;
    }

    nav ul {
      list-style: none;
      padding: 0;
    }

    nav ul li {
      display: inline;
      margin: 0 15px;
    }

    nav ul li a {
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    nav ul li a:hover {
      text-decoration: underline;
    }

    section {
      padding: 30px;
      max-width: 1000px;
      margin: auto;
    }

    section h2 {
      color: #004080;
      margin-bottom: 15px;
      border-bottom: 2px solid #004080;
      display: inline-block;
      padding-bottom: 5px;
    }

    article {
      margin-bottom: 30px;
    }

    .image-center {
      display: block;
      margin: 20px auto;
      width: 100%;
      max-width: 700px;
      border-radius: 8px;
    }

    footer {
      background: #004080;
      color: white;
      text-align: center;
      padding: 15px;
      margin-top: 40px;
    }

    /* Selector ID */
    #sejarah p {
      text-align: justify;
    }

    /* Selector Class */
    .highlight {
      background-color: #dfefff;
      padding: 10px;
      border-left: 4px solid #004080;
    }

    /* Selector Attribute */
    a[target="_blank"] {
      color: #ffcc00;
    }
  </style>
</head>
<body>
  <header>
    <h1>Profil Pondok Abu Dzar</h1>
    <nav>
    </nav>
  </header>

  <section id="sejarah">
    <h2>Sejarah Sekolah</h2>
    <article>
      <p>Sekolah Harapan Bangsa berdiri sejak tahun 2018 dengan tujuan mencetak generasi yang cerdas, berakhlak, dan berprestasi. Seiring berjalannya waktu, sekolah ini terus berkembang baik dari segi sarana, prasarana, maupun kualitas pendidikan.</p>
      <img src="gambar gedung.png" alt="Sekolah" class="image-center">
    </article>

  

  


</body>
</html>
